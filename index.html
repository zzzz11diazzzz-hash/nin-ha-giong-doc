<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Mark - Đơn Giản & Tốc Độ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .box {
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 550px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 { text-align: center; margin-top: 0; margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
        textarea, select {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        textarea { height: 110px; resize: vertical; }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
            background: rgba(15, 23, 42, 0.4);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .control-group label { font-size: 11px; margin-bottom: 4px; }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .control-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
        .control-header span { color: var(--primary); font-weight: bold; }
        input[type="range"] { width: 100%; accent-color: var(--primary); cursor: pointer; }
        .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        #speak-btn { background: var(--primary); }
        #speak-btn:hover { background: #4338ca; }
        #download-btn { background: #10b981; display: none; }
        #download-btn:hover { background: #059669; }
        audio { width: 100%; margin-top: 15px; border-radius: 8px; }
        .status { font-size: 12px; color: var(--muted); text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="box">
    <h2>🎙️ Voice Mark Đơn Giản</h2>
    
    <label>Văn bản tiếng Anh:</label>
    <textarea id="text" placeholder="Nhập văn bản vào đây..."></textarea>
    
    <label>Chọn giọng đọc (Ưu tiên giọng trầm ấm / tự nhiên):</label>
    <select id="voice"><option value="">Đang tải giọng...</option></select>

    <div class="row">
        <div class="control-group">
            <div class="control-header"><span>Tốc độ (Speed)</span><span id="rate-val">0.9x</span></div>
            <input type="range" id="rate" min="0.5" max="1.5" step="0.05" value="0.9">
        </div>
        <div class="control-group">
            <div class="control-header"><span>Độ trầm (Pitch)</span><span id="pitch-val">0.9</span></div>
            <input type="range" id="pitch" min="0.5" max="1.5" step="0.05" value="0.9">
        </div>
    </div>

    <div class="btns">
        <button id="speak-btn">🔊 Đọc & Tạo Audio</button>
        <button id="download-btn">📥 Tải Xuống MP3 (CapCut)</button>
    </div>

    <audio id="audio-player" controls></audio>
    <div class="status" id="status">Sẵn sàng.</div>
</div>

<script>
    const textInput = document.getElementById('text');
    const voiceSelect = document.getElementById('voice');
    const rateSlider = document.getElementById('rate');
    const rateVal = document.getElementById('rate-val');
    const pitchSlider = document.getElementById('pitch');
    const pitchVal = document.getElementById('pitch-val');
    const speakBtn = document.getElementById('speak-btn');
    const downloadBtn = document.getElementById('download-btn');
    const audioPlayer = document.getElementById('audio-player');
    const statusText = document.getElementById('status');

    let voices = [];
    let mediaRecorder;
    let chunks = [];
    let mp3Blob = null;

    rateSlider.oninput = () => rateVal.textContent = parseFloat(rateSlider.value).toFixed(2) + 'x';
    pitchSlider.oninput = () => pitchVal.textContent = parseFloat(pitchSlider.value).toFixed(2);

    function loadVoices() {
        if (!('speechSynthesis' in window)) return;
        voices = window.speechSynthesis.getVoices();
        if (!voices.length) return;

        voiceSelect.innerHTML = '';
        voices.forEach((v, i) => {
            if (v.lang.includes('en')) {
                let opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${v.name} (${v.lang})`;
                // Ưu tiên chọn các giọng đọc nam trầm ấm phổ biến trên máy tính
                if (v.name.includes('David') || v.name.includes('Mark') || v.name.includes('Guy') || v.name.includes('Natural') || v.name.includes('James')) {
                    opt.selected = true;
                }
                voiceSelect.appendChild(opt);
            }
        });
    }

    loadVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
    }
    setTimeout(loadVoices, 500);

    speakBtn.onclick = async () => {
        let text = textInput.value.trim();
        if (!text) { alert('Vui lòng nhập văn bản!'); return; }

        statusText.textContent = "Đang khởi tạo...";
        speakBtn.disabled = true;
        chunks = [];

        try {
            let stream = await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => {
                let ctx = new AudioContext();
                return ctx.createMediaStreamDestination().stream;
            });

            mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            
            mediaRecorder.onstop = async () => {
                statusText.textContent = "Đang xuất file MP3...";
                let webmBlob = new Blob(chunks, { type: 'audio/webm' });
                try {
                    mp3Blob = await convertToMp3(webmBlob);
                    audioPlayer.src = URL.createObjectURL(mp3Blob);
                    downloadBtn.style.display = 'block';
                    statusText.textContent = "Hoàn tất! Bạn có thể nghe thử hoặc tải xuống.";
                } catch(err) {
                    audioPlayer.src = URL.createObjectURL(webmBlob);
                    mp3Blob = webmBlob;
                    downloadBtn.style.display = 'block';
                    statusText.textContent = "Hoàn tất!";
                }
                speakBtn.disabled = false;
            };

            mediaRecorder.start();

            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            let vIdx = voiceSelect.value;
            if (vIdx !== "" && voices[vIdx]) utterance.voice = voices[vIdx];
            
            utterance.rate = parseFloat(rateSlider.value);
            utterance.pitch = parseFloat(pitchSlider.value); // Chỉnh độ trầm bổng tại đây

            utterance.onstart = () => { statusText.textContent = "🔊 Đang đọc..."; };
            utterance.onend = () => {
                setTimeout(() => {
                    if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
                }, 400);
            };

            window.speechSynthesis.speak(utterance);

        } catch (e) {
            speakBtn.disabled = false;
            statusText.textContent = "Lỗi micro hoặc trình duyệt.";
        }
    };

    async function convertToMp3(webmBlob) {
        let buffer = await webmBlob.arrayBuffer();
        let ctx = new (window.AudioContext || window.webkitAudioContext)();
        let decoded = await ctx.decodeAudioData(buffer);
        let samples = decoded.getChannelData(0);
        let encoder = new lamejs.Mp3Encoder(1, decoded.sampleRate, 128);
        let blockSize = 1152;
        let mp3Data = [];

        let pcm = new Int16Array(samples.length);
        for (let i = 0; i < samples.length; i++) {
            pcm[i] = samples[i] < 0 ? samples[i] * 32768 : samples[i] * 32767;
        }

        for (let i = 0; i < pcm.length; i += blockSize) {
            let chunk = pcm.subarray(i, i + blockSize);
            let encodedBuf = encoder.encodeBuffer(chunk);
            if (encodedBuf.length > 0) mp3Data.push(new Int8Array(encodedBuf));
        }
        let endBuf = encoder.flush();
        if (endBuf.length > 0) mp3Data.push(new Int8Array(endBuf));

        return new Blob(mp3Data, { type: 'audio/mp3' });
    }

    downloadBtn.onclick = () => {
        if (!mp3Blob) return;
        let a = document.createElement('a');
        a.href = URL.createObjectURL(mp3Blob);
        a.download = `voice-mark-${Date.now()}.mp3`;
        a.click();
    };
</script>

</body>
</html>
