<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Voice Mark AI - Xuất MP3 Chuẩn Cho CapCut</title>
    <!-- Thư viện hỗ trợ xuất chuẩn MP3 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px 35px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 620px;
        }
        h2 {
            color: #333;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            height: 130px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            resize: vertical;
            font-size: 15px;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-family: inherit;
        }
        select {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: white;
            cursor: pointer;
        }
        .sliders-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
            background: #fafbfc;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #eaeaea;
        }
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #666;
        }
        .slider-header span:last-child {
            font-weight: bold;
            color: #3498db;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #3498db;
            cursor: pointer;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .main-btns {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        #speak-btn {
            background-color: #3498db;
        }
        #speak-btn:hover {
            background-color: #2980b9;
        }
        #stop-btn {
            background-color: #e74c3c;
            display: none;
        }
        #stop-btn:hover {
            background-color: #c0392b;
        }
        #download-mp3-btn {
            background-color: #27ae60;
        }
        #download-mp3-btn:hover {
            background-color: #219150;
        }
        audio {
            width: 100%;
            margin-bottom: 10px;
            border-radius: 10px;
            display: block;
        }
        .note {
            font-size: 13px;
            color: #7f8c8d;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Tạo Voice Mark AI (Xuất MP3 Chuẩn)</h2>
    
    <label for="text-input">Nhập nội dung tiếng Anh:</label>
    <textarea id="text-input" placeholder="Nhập câu chuyện của bạn vào đây..."></textarea>
    
    <label for="voice-select">Chọn giọng đọc:</label>
    <select id="voice-select">
        <option value="">Đang tải danh sách giọng...</option>
    </select>

    <div class="sliders-grid">
        <div class="slider-group">
            <div class="slider-header">
                <label for="stability-slider" style="margin:0;">Sự ổn định (Stability)</label>
                <span id="stability-val">75%</span>
            </div>
            <input type="range" id="stability-slider" min="0" max="100" value="75">
        </div>

        <div class="slider-group">
            <div class="slider-header">
                <label for="clarity-slider" style="margin:0;">Sự khác nhau / Độ rõ (Clarity/Similarity)</label>
                <span id="clarity-val">80%</span>
            </div>
            <input type="range" id="clarity-slider" min="0" max="100" value="80">
        </div>

        <div class="slider-group">
            <div class="slider-header">
                <label for="rate-slider" style="margin:0;">Tốc độ nói (Speed Rate)</label>
                <span id="rate-val">0.9x</span>
            </div>
            <input type="range" id="rate-slider" min="0.5" max="1.5" step="0.05" value="0.9">
        </div>
    </div>

    <div class="btn-group">
        <div class="main-btns">
            <button id="speak-btn">🎙️ Đọc & Ghi Âm</button>
            <button id="stop-btn">⏹️ Dừng Lại</button>
        </div>
        <button id="download-mp3-btn">📥 Tải File MP3 Chuẩn (Dùng cho CapCut)</button>
    </div>
    
    <audio id="audio-preview" controls></audio>
    <div class="note" id="status-note">Sẵn sàng đọc và tạo file MP3.</div>
</div>

<script>
    const textInput = document.getElementById('text-input');
    const voiceSelect = document.getElementById('voice-select');
    const stabilitySlider = document.getElementById('stability-slider');
    const stabilityVal = document.getElementById('stability-val');
    const claritySlider = document.getElementById('clarity-slider');
    const clarityVal = document.getElementById('clarity-val');
    const rateSlider = document.getElementById('rate-slider');
    const rateVal = document.getElementById('rate-val');

    const speakBtn = document.getElementById('speak-btn');
    const stopBtn = document.getElementById('stop-btn');
    const downloadMp3Btn = document.getElementById('download-mp3-btn');
    const audioPreview = document.getElementById('audio-preview');
    const statusNote = document.getElementById('status-note');

    let voices = [];
    let mediaRecorder;
    let recordedChunks = [];
    let audioBlobForMp3 = null;

    stabilitySlider.oninput = () => stabilityVal.textContent = stabilitySlider.value + '%';
    claritySlider.oninput = () => clarityVal.textContent = claritySlider.value + '%';
    rateSlider.oninput = () => rateVal.textContent = parseFloat(rateSlider.value).toFixed(2) + 'x';

    function loadVoices() {
        if (!('speechSynthesis' in window)) return;
        voices = window.speechSynthesis.getVoices();
        if (voices.length === 0) return;

        voiceSelect.innerHTML = '';
        voices.forEach((voice, index) => {
            if (voice.lang.includes('en')) {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${voice.name} (${voice.lang})`;
                if (voice.name.includes('Mark') || voice.name.includes('Guy') || voice.name.includes('David') || voice.name.includes('Natural')) {
                    option.selected = true;
                }
                voiceSelect.appendChild(option);
            }
        });
    }

    loadVoices();
    if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
    }
    setTimeout(loadVoices, 500);

    function resetState() {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
        speakBtn.disabled = false;
        stopBtn.style.display = 'none';
        statusNote.textContent = "Đã dừng lại.";
    }

    stopBtn.addEventListener('click', resetState);

    speakBtn.addEventListener('click', async () => {
        const text = textInput.value.trim();
        if (!text) {
            alert('Vui lòng nhập nội dung!');
            return;
        }

        if (!('speechSynthesis' in window)) {
            alert('Trình duyệt không hỗ trợ đọc văn bản!');
            return;
        }

        statusNote.textContent = "Đang bắt đầu đọc và ghi âm...";
        speakBtn.disabled = true;
        stopBtn.style.display = 'flex';
        recordedChunks = [];

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => {
                const ctx = new AudioContext();
                const dest = ctx.createMediaStreamDestination();
                return dest.stream;
            });

            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = e => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = async () => {
                const webmBlob = new Blob(recordedChunks, { type: 'audio/webm' });
                
                statusNote.textContent = "Đang chuyển đổi sang file MP3 chuẩn...";
                try {
                    audioBlobForMp3 = await convertWebmToMp3(webmBlob);
                    audioPreview.src = URL.createObjectURL(audioBlobForMp3);
                    statusNote.textContent = "Hoàn tất! Bấm 'Tải File MP3 Chuẩn' để lưu về máy.";
                } catch (e) {
                    audioBlobForMp3 = webmBlob;
                    audioPreview.src = URL.createObjectURL(webmBlob);
                    statusNote.textContent = "Hoàn tất tạo file!";
                }

                speakBtn.disabled = false;
                stopBtn.style.display = 'none';
            };

            mediaRecorder.start();

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            const selectedIndex = voiceSelect.value;
            if (selectedIndex !== "" && voices[selectedIndex]) {
                utterance.voice = voices[selectedIndex];
            }

            utterance.rate = parseFloat(rateSlider.value);
            const stability = parseInt(stabilitySlider.value);
            const clarity = parseInt(claritySlider.value);

            let basePitch = 0.95;
            if (stability < 40) basePitch -= 0.1;
            else if (stability > 80) basePitch = 1.0;
            utterance.pitch = clarity > 80 ? basePitch + (clarity - 80) / 400 : basePitch;

            utterance.onstart = () => {
                statusNote.textContent = "Đang đọc...";
            };

            utterance.onend = () => {
                setTimeout(() => {
                    if (mediaRecorder && mediaRecorder.state === "recording") {
                        mediaRecorder.stop();
                    }
                }, 500);
            };

            utterance.onerror = () => {
                resetState();
                statusNote.textContent = "Lỗi khi đọc văn bản.";
            };

            window.speechSynthesis.speak(utterance);

        } catch (err) {
            speakBtn.disabled = false;
            stopBtn.style.display = 'none';
            statusNote.textContent = "Cần cấp quyền micro để ghi âm.";
            alert("Vui lòng cho phép trình duyệt sử dụng micro để ghi lại file.");
        }
    });

    async function convertWebmToMp3(webmBlob) {
        const arrayBuffer = await webmBlob.arrayBuffer();
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

        const channels = 1;
        const sampleRate = audioBuffer.sampleRate;
        const samples = audioBuffer.getChannelData(0);

        const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, 128);
        const sampleBlockSize = 1152;
        const mp3Data = [];

        const left = new Int16Array(samples.length);
        for (let i = 0; i < samples.length; i++) {
            left[i] = samples[i] < 0 ? samples[i] * 0x8000 : samples[i] * 0x7FFF;
        }

        for (let i = 0; i < left.length; i += sampleBlockSize) {
            const chunk = left.subarray(i, i + sampleBlockSize);
            const mp3buf = mp3encoder.encodeBuffer(chunk);
            if (mp3buf.length > 0) {
                mp3Data.push(new Int8Array(mp3buf));
            }
        }

        const mp3buf = mp3encoder.flush();
        if (mp3buf.length > 0) {
            mp3Data.push(new Int8Array(mp3buf));
        }

        return new Blob(mp3Data, { type: 'audio/mp3' });
    }

    downloadMp3Btn.addEventListener('click', () => {
        if (!audioBlobForMp3) {
            alert('Bạn cần bấm "Đọc & Ghi Âm" hoàn tất để tạo file trước khi tải!');
            return;
        }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(audioBlobForMp3);
        a.download = `voice-mark-${Date.now()}.mp3`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    });
</script>

</body>
</html>
