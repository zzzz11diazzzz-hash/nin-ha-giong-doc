<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceCraft Studio - Professional Deep Voice Generator</title>
    <!-- Thư viện lamejs chuẩn qua CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
    <style>
        :root {
            --primary: #f59e0b;
            --primary-hover: #d97706;
            --danger: #ef4444;
            --success: #10b981;
            --bg: #090d16;
            --card: #131c31;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --border: #1e293b;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: var(--card);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 700px;
            border: 1px solid var(--border);
        }

        h2 {
            color: var(--text);
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--muted);
            font-size: 13px;
            text-transform: uppercase;
        }

        .quick-templates {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .template-chip {
            background-color: rgba(245, 158, 11, 0.15);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .template-chip:hover {
            background-color: var(--primary);
            color: #090d16;
        }

        textarea {
            width: 100%;
            height: 130px;
            padding: 15px;
            background-color: #090d16;
            border: 2px solid var(--border);
            border-radius: 14px;
            resize: vertical;
            font-size: 15px;
            box-sizing: border-box;
            margin-bottom: 20px;
            color: var(--text);
            font-family: inherit;
        }

        textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        select {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background-color: #090d16;
            border: 2px solid var(--border);
            border-radius: 14px;
            font-size: 15px;
            box-sizing: border-box;
            color: var(--text);
            cursor: pointer;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
            background: rgba(9, 13, 22, 0.6);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--muted);
        }

        .control-header span:last-child {
            font-weight: 700;
            color: var(--primary);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .progress-box {
            width: 100%;
            background-color: #090d16;
            border-radius: 8px;
            height: 10px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
            display: none;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: var(--primary);
            transition: width 0.2s ease;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .main-row {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 700;
            color: white;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #generate-btn { background-color: var(--primary); color: #090d16; }
        #generate-btn:hover { background-color: var(--primary-hover); }

        #stop-btn { background-color: var(--danger); display: none; }
        #stop-btn:hover { background-color: #dc2626; }

        #download-btn { background-color: var(--success); }
        #download-btn:hover { background-color: #059669; }

        .preview-box {
            background: rgba(9, 13, 22, 0.6);
            padding: 15px;
            border-radius: 14px;
            border: 1px solid var(--border);
            margin-bottom: 15px;
        }

        audio {
            width: 100%;
            display: block;
        }

        .status {
            font-size: 13px;
            color: var(--muted);
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎙️ VoiceCraft Studio (Advanced Edition)</h2>

    <label for="text-input">Nội dung văn bản cần chuyển đổi:</label>
    <textarea id="text-input" placeholder="Nhập câu chuyện hoặc văn bản của bạn vào đây..."></textarea>
    
    <!-- Thanh nút tạo nhanh mẫu văn bản -->
    <div class="quick-templates">
        <button type="button" class="template-chip" onclick="setTemplate('story')">📖 Kể chuyện</button>
        <button type="button" class="template-chip" onclick="setTemplate('review')">🎬 Review Phim</button>
        <button type="button" class="template-chip" onclick="setTemplate('quote')">💡 Câu nói hay</button>
        <button type="button" class="template-chip" onclick="setTemplate('tips')">🚀 Mẹo hay</button>
    </div>

    <label for="voice-select">Lựa chọn chất giọng:</label>
    <select id="voice-select">
        <option value="">Đang quét bộ lọc giọng đọc...</option>
    </select>

    <!-- Bảng điều khiển thông số mở rộng -->
    <div class="controls-grid">
        <div class="control-group">
            <div class="control-header">
                <label style="margin:0; font-size:11px;">Độ Trầm Ấm (Pitch)</label>
                <span id="pitch-val">0.70x</span>
            </div>
            <input type="range" id="pitch-slider" min="0.4" max="1.0" step="0.05" value="0.70">
        </div>

        <div class="control-group">
            <div class="control-header">
                <label style="margin:0; font-size:11px;">Tốc độ đọc (Speed)</label>
                <span id="rate-val">0.85x</span>
            </div>
            <input type="range" id="rate-slider" min="0.5" max="1.3" step="0.05" value="0.85">
        </div>

        <div class="control-group">
            <div class="control-header">
                <label style="margin:0; font-size:11px;">Sự ổn định (Stability)</label>
                <span id="stability-val">75%</span>
            </div>
            <input type="range" id="stability-slider" min="0" max="100" value="75">
        </div>

        <div class="control-group">
            <div class="control-header">
                <label style="margin:0; font-size:11px;">Sự tương đồng (Similarity)</label>
                <span id="similarity-val">85%</span>
            </div>
            <input type="range" id="similarity-slider" min="0" max="100" value="85">
        </div>

        <div class="control-group" style="grid-column: span 2;">
            <div class="control-header">
                <label style="margin:0; font-size:11px;">Phóng đại âm thanh (Amplification / Gain)</label>
                <span id="amplification-val">1.2x</span>
            </div>
            <input type="range" id="amplification-slider" min="1.0" max="3.0" step="0.1" value="1.2">
        </div>
    </div>

    <div class="progress-box" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="actions">
        <div class="main-row">
            <button id="generate-btn">🎙️ Bắt Đầu Đọc & Ghi Âm</button>
            <button id="stop-btn">⏹️ Dừng Lại</button>
        </div>
        <button id="download-btn">📥 Tải Xuống File MP3 Chất Lượng Cao</button>
    </div>

    <div class="preview-box">
        <label style="margin-bottom: 6px; font-size: 10px;">Nghe trước kết quả:</label>
        <audio id="audio-preview" controls></audio>
    </div>

    <div class="status" id="status-text">Hệ thống sẵn sàng tạo giọng đọc chuyên nghiệp.</div>
</div>

<script>
    const textInput = document.getElementById('text-input');
    const voiceSelect = document.getElementById('voice-select');
    const pitchSlider = document.getElementById('pitch-slider');
    const pitchVal = document.getElementById('pitch-val');
    const rateSlider = document.getElementById('rate-slider');
    const rateVal = document.getElementById('rate-val');
    const stabilitySlider = document.getElementById('stability-slider');
    const stabilityVal = document.getElementById('stability-val');
    const similaritySlider = document.getElementById('similarity-slider');
    const similarityVal = document.getElementById('similarity-val');
    const amplificationSlider = document.getElementById('amplification-slider');
    const amplificationVal = document.getElementById('amplification-val');

    const generateBtn = document.getElementById('generate-btn');
    const stopBtn = document.getElementById('stop-btn');
    const downloadBtn = document.getElementById('download-btn');
    const audioPreview = document.getElementById('audio-preview');
    const statusText = document.getElementById('status-text');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');

    let systemVoices = [];
    let mediaRecorder;
    let audioChunks = [];
    let finalMp3Blob = null;
    let timerInterval = null;

    // Cập nhật giá trị hiển thị trên slider
    pitchSlider.oninput = () => pitchVal.textContent = parseFloat(pitchSlider.value).toFixed(2) + 'x';
    rateSlider.oninput = () => rateVal.textContent = parseFloat(rateSlider.value).toFixed(2) + 'x';
    stabilitySlider.oninput = () => stabilityVal.textContent = stabilitySlider.value + '%';
    similaritySlider.oninput = () => similarityVal.textContent = similaritySlider.value + '%';
    amplificationSlider.oninput = () => amplificationVal.textContent = parseFloat(amplificationSlider.value).toFixed(1) + 'x';

    function setTemplate(type) {
        const templates = {
            story: "Once upon a time, in a quiet little village nestled between the mountains, there lived a curious young boy who dreamed of exploring the stars.",
            review: "You won't believe what happens in the final scene of this movie! It completely twists everything you thought you knew from the beginning.",
            quote: "Success is not final, failure is not fatal: it is the courage to continue that counts.",
            tips: "Here are three quick tips to boost your productivity today: First, prioritize your most important task. Second, eliminate distractions. Third, take short breaks."
        };
        if (templates[type]) {
            textInput.value = templates[type];
            statusText.textContent = `Đã nạp mẫu: ${type.toUpperCase()}`;
        }
    }

    function populateVoices() {
        if (!('speechSynthesis' in window)) return;
        systemVoices = window.speechSynthesis.getVoices();
        if (systemVoices.length === 0) return;

        voiceSelect.innerHTML = '';
        systemVoices.sort((a, b) => {
            const aName = a.name.toLowerCase();
            const bName = b.name.toLowerCase();
            const aScore = (aName.includes('david') || aName.includes('mark') || aName.includes('guy') || aName.includes('natural') || aName.includes('google')) ? 1 : 0;
            const bScore = (bName.includes('david') || bName.includes('mark') || bName.includes('guy') || bName.includes('natural') || bName.includes('google')) ? 1 : 0;
            return bScore - aScore;
        });

        systemVoices.forEach((voice, index) => {
            const option = document.createElement('option');
            option.value = index;
            let label = `${voice.name} (${voice.lang})`;
            if (voice.name.toLowerCase().includes('david') || voice.name.toLowerCase().includes('mark') || voice.name.toLowerCase().includes('guy') || voice.name.toLowerCase().includes('james')) {
                label += ' 🎙️ [Nam Trầm Ấm]';
                option.selected = true;
            } else if (voice.name.toLowerCase().includes('natural') || voice.name.toLowerCase().includes('online')) {
                label += ' ⭐ [Cao Cấp]';
            }
            option.textContent = label;
            voiceSelect.appendChild(option);
        });
    }

    populateVoices();
    if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = populateVoices;
    }
    setTimeout(populateVoices, 500);

    function abortProcess() {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
        if (timerInterval) clearInterval(timerInterval);
        progressContainer.style.display = 'none';
        progressBar.style.width = '0%';
        generateBtn.disabled = false;
        stopBtn.style.display = 'none';
        statusText.textContent = "Đã dừng tiến trình.";
    }

    stopBtn.addEventListener('click', abortProcess);

    generateBtn.addEventListener('click', async () => {
        const text = textInput.value.trim();
        if (!text) {
            alert('Vui lòng nhập nội dung văn bản cần chuyển đổi!');
            return;
        }

        if (!('speechSynthesis' in window)) {
            alert('Trình duyệt không hỗ trợ đọc văn bản!');
            return;
        }

        generateBtn.disabled = true;
        stopBtn.style.display = 'flex';
        progressContainer.style.display = 'block';
        progressBar.style.width = '0%';
        audioChunks = [];

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => {
                throw new Error("Microphone access denied");
            });

            mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
            mediaRecorder.ondataavailable = e => {
                if (e.data.size > 0) audioChunks.push(e.data);
            };

            let capturedBlob;
            mediaRecorder.onstop = async () => {
                capturedBlob = new Blob(audioChunks, { type: 'audio/webm' });
                if (timerInterval) clearInterval(timerInterval);
                progressBar.style.width = '90%';
                statusText.textContent = "Đang mã hóa sang định dạng MP3 và áp dụng hiệu ứng phóng đại...";

                try {
                    finalMp3Blob = await convertWebmToMp3WithAmplification(capturedBlob, parseFloat(amplificationSlider.value));
                    audioPreview.src = URL.createObjectURL(finalMp3Blob);
                    progressBar.style.width = '100%';
                    statusText.textContent = "✨ Hoàn thành! Âm thanh đã sẵn sàng để phát hoặc tải xuống.";
                } catch (err) {
                    console.error(err);
                    finalMp3Blob = capturedBlob;
                    audioPreview.src = URL.createObjectURL(capturedBlob);
                    progressBar.style.width = '100%';
                    statusText.textContent = "Đã tạo âm thanh thành công!";
                }

                setTimeout(() => {
                    progressContainer.style.display = 'none';
                }, 1000);

                generateBtn.disabled = false;
                stopBtn.style.display = 'none';
            };

            mediaRecorder.start();

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            const selectedIdx = voiceSelect.value;
            if (selectedIdx !== "" && systemVoices[selectedIdx]) {
                utterance.voice = systemVoices[selectedIdx];
            }

            utterance.rate = parseFloat(rateSlider.value);
            utterance.pitch = parseFloat(pitchSlider.value);

            let estimatedDuration = (text.length / 14) * (1 / utterance.rate) * 1000;
            let currentWidth = 0;
            let step = 100 / (estimatedDuration / 100);

            utterance.onstart = () => {
                statusText.textContent = `🔊 Đang đọc (Ổn định: ${stabilitySlider.value}%, Tương đồng: ${similaritySlider.value}%)...`;
                timerInterval = setInterval(() => {
                    currentWidth += step;
                    if (currentWidth < 85) {
                        progressBar.style.width = currentWidth + '%';
                    }
                }, 100);
            };

            utterance.onend = () => {
                if (timerInterval) clearInterval(timerInterval);
                setTimeout(() => {
                    if (mediaRecorder && mediaRecorder.state === "recording") {
                        mediaRecorder.stop();
                    }
                }, 500);
            };

            utterance.onerror = () => {
                abortProcess();
                statusText.textContent = "Lỗi trong quá trình tổng hợp âm thanh.";
            };

            window.speechSynthesis.speak(utterance);

        } catch (error) {
            generateBtn.disabled = false;
            stopBtn.style.display = 'none';
            progressContainer.style.display = 'none';
            statusText.textContent = "Yêu cầu quyền truy cập micro để xử lý xuất file.";
            alert("Vui lòng cấp quyền micro để hệ thống ghi lại âm thanh.");
        }
    });

    // Hàm chuyển đổi kèm xử lý khuyếch đại biên độ (Phóng đại - Amplification/Gain)
    async function convertWebmToMp3WithAmplification(webmBlob, gainFactor) {
        const buffer = await webmBlob.arrayBuffer();
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const decoded = await audioCtx.decodeAudioData(buffer);

        const channels = 1;
        const sampleRate = decoded.sampleRate;
        const inputData = decoded.getChannelData(0);

        const encoder = new lamejs.Mp3Encoder(channels, sampleRate, 128);
        const blockSize = 1152;
        const mp3Buffers = [];

        const pcmSamples = new Int16Array(inputData.length);
        for (let i = 0; i < inputData.length; i++) {
            // Áp dụng hệ số phóng đại (Gain / Amplification)
            let amplified = inputData[i] * gainFactor;
            // Giới hạn biên độ để tránh bị vỡ tiếng (clipping)
            if (amplified > 1.0) amplified = 1.0;
            if (amplified < -1.0) amplified = -1.0;

            pcmSamples[i] = amplified < 0 ? amplified * 0x8000 : amplified * 0x7FFF;
        }

        for (let i = 0; i < pcmSamples.length; i += blockSize) {
            const chunk = pcmSamples.subarray(i, i + blockSize);
            const encodedChunk = encoder.encodeBuffer(chunk);
            if (encodedChunk.length > 0) {
                mp3Buffers.push(new Int8Array(encodedChunk));
            }
        }

        const finalFlush = encoder.flush();
        if (finalFlush.length > 0) {
            mp3Buffers.push(new Int8Array(finalFlush));
        }

        return new Blob(mp3Buffers, { type: 'audio/mp3' });
    }

    downloadBtn.addEventListener('click', () => {
        if (!finalMp3Blob) {
            alert('Bạn cần bấm nút "Bắt Đầu Đọc & Ghi Âm" trước!');
            return;
        }
        const link = document.createElement('a');
        link.href = URL.createObjectURL(finalMp3Blob);
        link.download = `voicecraft-audio-${Date.now()}.mp3`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });
</script>

</body>
</html>
