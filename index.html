<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Mark AI Pro - Xuất MP3 Cho CapCut</title>
    <!-- Thư viện hỗ trợ xuất chuẩn MP3 qua CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 650px;
            border: 1px solid var(--border-color);
        }

        h2 {
            color: var(--text-color);
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 14px;
            background-color: #0f172a;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            resize: vertical;
            font-size: 15px;
            box-sizing: border-box;
            margin-bottom: 20px;
            color: var(--text-color);
            font-family: inherit;
            transition: border-color 0.2s;
        }

        textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        select {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 20px;
            background-color: #0f172a;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            box-sizing: border-box;
            color: var(--text-color);
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .sliders-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 25px;
            background: rgba(15, 23, 42, 0.5);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
        }

        .slider-header span:last-child {
            font-weight: 600;
            color: var(--primary-color);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .main-btns {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 600;
            color: white;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #speak-btn {
            background-color: var(--primary-color);
        }
        #speak-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        #stop-btn {
            background-color: var(--danger-color);
            display: none;
        }
        #stop-btn:hover {
            background-color: #dc2626;
        }

        #download-mp3-btn {
            background-color: var(--success-color);
        }
        #download-mp3-btn:hover {
            background-color: #059669;
            transform: translateY(-1px);
        }

        .preview-section {
            background: rgba(15, 23, 42, 0.5);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        audio {
            width: 100%;
            border-radius: 8px;
            display: block;
        }

        .note {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>✨ Voice Mark AI Pro</h2>
    
    <label for="text-input">Nội dung tiếng Anh:</label>
    <textarea id="text-input" placeholder="Nhập câu chuyện hoặc văn bản của bạn vào đây..."></textarea>
    
    <label for="voice-select">Giọng đọc hệ thống:</label>
    <select id="voice-select">
        <option value="">Đang tải danh sách giọng...</option>
    </select>

    <div class="sliders-grid">
        <div class="slider-group">
            <div class="slider-header">
                <label style="margin:0; font-size:12px;">Độ ổn định (Stability)</label>
                <span id="stability-val">75%</span>
            </div>
            <input type="range" id="stability-slider" min="0" max="100" value="75">
        </div>

        <div class="slider-group">
            <div class="slider-header">
                <label style="margin:0; font-size:12px;">Độ rõ tiếng (Clarity)</label>
                <span id="clarity-val">80%</span>
            </div>
            <input type="range" id="clarity-slider" min="0" max="100" value="80">
        </div>

        <div class="slider-group">
            <div class="slider-header">
                <label style="margin:0; font-size:12px;">Tốc độ đọc (Speed)</label>
                <span id="rate-val">0.9x</span>
            </div>
            <input type="range" id="rate-slider" min="0.5" max="1.5" step="0.05" value="0.9">
        </div>
    </div>

    <div class="btn-group">
        <div class="main-btns">
            <button id="speak-btn">🎙️ Bắt đầu Đọc & Ghi</button>
            <button id="stop-btn">⏹️ Dừng Lại</button>
        </div>
        <button id="download-mp3-btn">📥 Tải Xuống File MP3 (CapCut)</button>
    </div>
    
    <div class="preview-section">
        <label style="margin-bottom: 6px; font-size: 11px;">Nghe lại trước khi tải:</label>
        <audio id="audio-preview" controls></audio>
    </div>

    <div class="note" id="status-note">Hệ thống sẵn sàng tạo âm thanh.</div>
</div>

<script>
    const textInput = document.getElementById('text-input');
    const voiceSelect = document.getElementById('voice-select');
    const stabilitySlider = document.getElementById('stability-slider');
    const stabilityVal = document.getElementById('stability-val');
    const claritySlider = document.getElementById('clarity-slider');
    const clarityVal = document.getElementById('clarity-val');
    const rateSlider = document.getElementById('rate-slider');
    const rateVal = document.getElementById('rate-val');

    const speakBtn = document.getElementById('speak-btn');
    const stopBtn = document.getElementById('stop-btn');
    const downloadMp3Btn = document.getElementById('download-mp3-btn');
    const audioPreview = document.getElementById('audio-preview');
    const statusNote = document.getElementById('status-note');

    let voices = [];
    let mediaRecorder;
    let recordedChunks = [];
    let audioBlobForMp3 = null;

    stabilitySlider.oninput = () => stabilityVal.textContent = stabilitySlider.value + '%';
    claritySlider.oninput = () => clarityVal.textContent = claritySlider.value + '%';
    rateSlider.oninput = () => rateVal.textContent = parseFloat(rateSlider.value).toFixed(2) + 'x';

    function loadVoices() {
        if (!('speechSynthesis' in window)) return;
        voices = window.speechSynthesis.getVoices();
        if (voices.length === 0) return;

        voiceSelect.innerHTML = '';
        voices.forEach((voice, index) => {
            if (voice.lang.includes('en')) {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${voice.name} (${voice.lang})`;
                if (voice.name.includes('Mark') || voice.name.includes('Guy') || voice.name.includes('David') || voice.name.includes('Natural')) {
                    option.selected = true;
                }
                voiceSelect.appendChild(option);
            }
        });
    }

    loadVoices();
    if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
    }
    setTimeout(loadVoices, 500);

    function resetState() {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
        speakBtn.disabled = false;
        stopBtn.style.display = 'none';
        statusNote.textContent = "Đã dừng thao tác.";
    }

    stopBtn.addEventListener('click', resetState);

    speakBtn.addEventListener('click', async () => {
        const text = textInput.value.trim();
        if (!text) {
            alert('Vui lòng nhập nội dung văn bản!');
            return;
        }

        if (!('speechSynthesis' in window)) {
            alert('Trình duyệt của bạn không hỗ trợ đọc văn bản!');
            return;
        }

        statusNote.textContent = "Đang khởi tạo tiến trình đọc...";
        speakBtn.disabled = true;
        stopBtn.style.display = 'flex';
        recordedChunks = [];

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => {
                const ctx = new AudioContext();
                const dest = ctx.createMediaStreamDestination();
                return dest.stream;
            });

            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = e => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = async () => {
                const webmBlob = new Blob(recordedChunks, { type: 'audio/webm' });
                
                statusNote.textContent = "Đang tối ưu và chuyển đổi sang MP3...";
                try {
                    audioBlobForMp3 = await convertWebmToMp3(webmBlob);
                    audioPreview.src = URL.createObjectURL(audioBlobForMp3);
                    statusNote.textContent = "✨ Hoàn tất! Bạn có thể nghe thử hoặc bấm tải xuống.";
                } catch (e) {
                    audioBlobForMp3 = webmBlob;
                    audioPreview.src = URL.createObjectURL(webmBlob);
                    statusNote.textContent = "Hoàn tất tạo âm thanh!";
                }

                speakBtn.disabled = false;
                stopBtn.style.display = 'none';
            };

            mediaRecorder.start();

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            const selectedIndex = voiceSelect.value;
            if (selectedIndex !== "" && voices[selectedIndex]) {
                utterance.voice = voices[selectedIndex];
            }

            utterance.rate = parseFloat(rateSlider.value);
            const stability = parseInt(stabilitySlider.value);
            const clarity = parseInt(claritySlider.value);

            let basePitch = 0.95;
            if (stability < 40) basePitch -= 0.1;
            else if (stability > 80) basePitch = 1.0;
            utterance.pitch = clarity > 80 ? basePitch + (clarity - 80) / 400 : basePitch;

            utterance.onstart = () => {
                statusNote.textContent = "🔊 Đang đọc văn bản...";
            };

            utterance.onend = () => {
                setTimeout(() => {
                    if (mediaRecorder && mediaRecorder.state === "recording") {
                        mediaRecorder.stop();
                    }
                }, 500);
            };

            utterance.onerror = () => {
                resetState();
                statusNote.textContent = "Có lỗi xảy ra khi đọc.";
            };

            window.speechSynthesis.speak(utterance);

        } catch (err) {
            speakBtn.disabled = false;
            stopBtn.style.display = 'none';
            statusNote.textContent = "Cần quyền micro để xử lý.";
            alert("Vui lòng cấp quyền micro cho trang web.");
        }
    });

    async function convertWebmToMp3(webmBlob) {
        const arrayBuffer = await webmBlob.arrayBuffer();
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

        const channels = 1;
        const sampleRate = audioBuffer.sampleRate;
        const samples = audioBuffer.getChannelData(0);

        const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, 128);
        const sampleBlockSize = 1152;
        const mp3Data = [];

        const left = new Int16Array(samples.length);
        for (let i = 0; i < samples.length; i++) {
            left[i] = samples[i] < 0 ? samples[i] * 0x8000 : samples[i] * 0x7FFF;
        }

        for (let i = 0; i < left.length; i += sampleBlockSize) {
            const chunk = left.subarray(i, i + sampleBlockSize);
            const mp3buf = mp3encoder.encodeBuffer(chunk);
            if (mp3buf.length > 0) {
                mp3Data.push(new Int8Array(mp3buf));
            }
        }

        const mp3buf = mp3encoder.flush();
        if (mp3buf.length > 0) {
            mp3Data.push(new Int8Array(mp3buf));
        }

        return new Blob(mp3Data, { type: 'audio/mp3' });
    }

    downloadMp3Btn.addEventListener('click', () => {
        if (!audioBlobForMp3) {
            alert('Bạn cần bấm "Bắt đầu Đọc & Ghi" trước khi tải xuống!');
            return;
        }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(audioBlobForMp3);
        a.download = `voice-mark-pro-${Date.now()}.mp3`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    });
</script>

</body>
</html>
